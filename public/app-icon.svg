<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="hdBgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111B35" />
      <stop offset="60%" stop-color="#070D1D" />
      <stop offset="100%" stop-color="#03060E" />
    </radialGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="hdGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- 3D Metallic Gold Coin Primary Gradient -->
    <radialGradient id="hdCoinSurface" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="22%" stop-color="#FDE68A" />
      <stop offset="52%" stop-color="#F59E0B" />
      <stop offset="78%" stop-color="#D97706" />
      <stop offset="92%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Coin Inner Face Radial Gradient -->
    <radialGradient id="hdInnerFace" cx="40%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#853005" />
    </radialGradient>

    <!-- Ambient Golden Flare Glow -->
    <radialGradient id="hdAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#070D1D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Luxury Squircle App Icon Base -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#hdBgGrad)" stroke="url(#hdGoldBorder)" stroke-width="7" />

  <!-- Inner Subtle Beveled Ring -->
  <rect x="30" y="30" width="452" height="452" rx="98" fill="none" stroke="#FDE68A" stroke-opacity="0.3" stroke-width="2.5" />

  <!-- Ambient Golden Radiance Behind Coin -->
  <circle cx="256" cy="256" r="220" fill="url(#hdAura)" />

  <!-- Four Sharp Auspicious Corner Sparkles -->
  <g fill="#FDE68A">
    <!-- Top-Left -->
    <path d="M 72 72 Q 72 88 56 88 Q 72 88 72 104 Q 72 88 88 88 Q 72 88 72 72 Z" opacity="0.9" />
    <!-- Top-Right -->
    <path d="M 440 72 Q 440 88 424 88 Q 440 88 440 104 Q 440 88 456 88 Q 440 88 440 72 Z" opacity="0.9" />
    <!-- Bottom-Left -->
    <path d="M 72 440 Q 72 456 56 456 Q 72 456 72 472 Q 72 456 88 456 Q 72 456 72 440 Z" opacity="0.6" />
    <!-- Bottom-Right -->
    <path d="M 440 440 Q 440 456 424 456 Q 440 456 440 472 Q 440 456 456 456 Q 440 456 440 440 Z" opacity="0.6" />
  </g>

  <!-- Radiating Sunburst Accent -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#FDE68A" stroke-opacity="0.25" stroke-dasharray="6 10" stroke-width="3" />

  <!-- 3D High-Definition Gold Coin (Prominent, Large, Razor Sharp) -->
  <g id="mainCoinGroup">
    <!-- Outer Drop Shadow Ring (Crisp, No Heavy Blur) -->
    <circle cx="256" cy="262" r="186" fill="#000000" opacity="0.45" />

    <!-- Outer Rim Base -->
    <circle cx="256" cy="256" r="186" fill="url(#hdCoinSurface)" stroke="#FDE68A" stroke-width="3" />

    <!-- Coin Specular Highlight Ring -->
    <circle cx="253" cy="253" r="180" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.85" />
    <circle cx="259" cy="259" r="180" fill="none" stroke="#5B2002" stroke-width="3.5" opacity="0.75" />

    <!-- Beaded Rosette / Sacred Coin Dots -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="#FFFBEB" stroke-dasharray="5 10" stroke-width="5" opacity="0.9" stroke-linecap="round" />

    <!-- Inner Coin Face Recessed Well -->
    <circle cx="256" cy="256" r="148" fill="url(#hdInnerFace)" />

    <!-- Inner Bevel Shadow & Glow -->
    <circle cx="258" cy="258" r="147" fill="none" stroke="#3D1300" stroke-width="4.5" opacity="0.65" />
    <circle cx="254" cy="254" r="147" fill="none" stroke="#FFFDE6" stroke-width="3.5" opacity="0.85" />

    <!-- Sacred Kalash Watermark -->
    <g opacity="0.22" fill="#FFFBEB">
      <path d="M 224 320 Q 208 275 230 248 L 282 248 Q 304 275 288 320 Z" />
      <circle cx="256" cy="228" r="20" />
    </g>

    <!-- Official High-Definition 3D Embossed Indian Rupee Symbol (₹) -->
    <!-- Shadow Layer (Embossed depth) -->
    <g transform="translate(2, 4)" stroke="#2C0C00" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
      <path d="M 194 174 L 318 174" />
      <path d="M 194 218 L 318 218" />
      <path d="M 236 174 C 292 174, 292 258, 236 258 L 194 258 L 278 338" />
    </g>

    <!-- Main High-Contrast Deep Bronze/Chocolate Rupee Core -->
    <g stroke="#3D1300" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 194 174 L 318 174" />
      <path d="M 194 218 L 318 218" />
      <path d="M 236 174 C 292 174, 292 258, 236 258 L 194 258 L 278 338" />
    </g>

    <!-- Top Specular Highlight Edge (Sunlight glint) -->
    <g transform="translate(-1, -1.5)" stroke="#FFFDE6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <path d="M 198 174 L 314 174" />
      <path d="M 198 218 L 314 218" />
      <path d="M 236 174 C 288 174, 288 258, 236 258 L 198 258 L 276 334" />
    </g>
  </g>

  <!-- Crown Jewel Sparkle on Top Rim of Coin -->
  <g transform="translate(256, 70)">
    <polygon points="0,-16 5,-5 16,0 5,5 0,16 -5,5 -16,0 -5,-5" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3.5" fill="#FEF08A" />
  </g>
</svg>
