<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="hdBgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111B35" />
      <stop offset="60%" stop-color="#070D1D" />
      <stop offset="100%" stop-color="#03060E" />
    </radialGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="hdGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- 3D Metallic Gold Coin Primary Gradient -->
    <radialGradient id="hdCoinSurface" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="20%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Coin Inner Face Radial Gradient -->
    <radialGradient id="hdInnerFace" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#652504" />
    </radialGradient>

    <!-- Ambient Golden Flare Glow -->
    <radialGradient id="hdAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070D1D" stop-opacity="0" />
    </radialGradient>

    <!-- Sharp 3D Drop Shadows -->
    <filter id="hdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Luxury Squircle App Icon Base -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#hdBgGrad)" stroke="url(#hdGoldBorder)" stroke-width="7" />

  <!-- Inner Subtle Beveled Ring -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#FDE68A" stroke-opacity="0.25" stroke-width="2.5" />

  <!-- Ambient Golden Radiance Behind Coin -->
  <circle cx="256" cy="256" r="210" fill="url(#hdAura)" />

  <!-- Four Sharp Auspicious Corner Sparkles -->
  <g fill="#FDE68A">
    <!-- Top-Left -->
    <path d="M 72 72 Q 72 88 56 88 Q 72 88 72 104 Q 72 88 88 88 Q 72 88 72 72 Z" opacity="0.9" />
    <!-- Top-Right -->
    <path d="M 440 72 Q 440 88 424 88 Q 440 88 440 104 Q 440 88 456 88 Q 440 88 440 72 Z" opacity="0.9" />
    <!-- Bottom-Left -->
    <path d="M 72 440 Q 72 456 56 456 Q 72 456 72 472 Q 72 456 88 456 Q 72 456 72 440 Z" opacity="0.5" />
    <!-- Bottom-Right -->
    <path d="M 440 440 Q 440 456 424 456 Q 440 456 440 472 Q 440 456 456 456 Q 440 456 440 440 Z" opacity="0.5" />
  </g>

  <!-- Subtle Radiating Sunburst Rays -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#FDE68A" stroke-opacity="0.2" stroke-dasharray="6 10" stroke-width="3" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2" />

  <!-- The 3D High-Definition Gold Coin (Prominent, Centered, Razor Sharp) -->
  <g filter="url(#hdShadow)">
    <!-- Outer Rim Base -->
    <circle cx="256" cy="256" r="162" fill="url(#hdCoinSurface)" />

    <!-- Coin Specular Highlight Ring -->
    <circle cx="253" cy="253" r="156" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.8" />
    <circle cx="259" cy="259" r="156" fill="none" stroke="#5B2002" stroke-width="3.5" opacity="0.85" />

    <!-- Beaded Rosette / Sacred Coin Dots (High Definition) -->
    <circle cx="256" cy="256" r="142" fill="none" stroke="#FFFBEB" stroke-dasharray="4 8" stroke-width="4.5" opacity="0.9" stroke-linecap="round" />

    <!-- Inner Coin Face Recessed Well -->
    <circle cx="256" cy="256" r="128" fill="url(#hdInnerFace)" />

    <!-- Inner Bevel Shadow & Glow -->
    <circle cx="258" cy="258" r="127" fill="none" stroke="#3D1300" stroke-width="4" opacity="0.7" />
    <circle cx="254" cy="254" r="127" fill="none" stroke="#FFFDE6" stroke-width="3" opacity="0.8" />

    <!-- Sacred Kalash Outline Watermark on Coin Face -->
    <g opacity="0.25" fill="#FFFBEB">
      <path d="M 226 312 Q 212 275 232 250 L 280 250 Q 300 275 286 312 Z" />
      <path d="M 232 250 Q 208 232 224 212 Q 238 232 240 250 Z" />
      <path d="M 280 250 Q 304 232 288 212 Q 274 232 272 250 Z" />
      <circle cx="256" cy="232" r="18" />
    </g>

    <!-- Official High-Definition 3D Embossed Indian Rupee Symbol (₹) -->
    <!-- Layer 1: Deep Carved Drop Shadow -->
    <g transform="translate(3, 5)" stroke="#321000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 202 184 L 310 184" />
      <path d="M 202 222 L 310 222" />
      <path d="M 238 184 C 286 184, 286 256, 238 256 L 202 256 L 274 328" />
    </g>

    <!-- Layer 2: Radiant Specular Highlight Edge -->
    <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
      <path d="M 202 184 L 310 184" />
      <path d="M 202 222 L 310 222" />
      <path d="M 238 184 C 286 184, 286 256, 238 256 L 202 256 L 274 328" />
    </g>

    <!-- Layer 3: Vibrant Metallic Gold Foreground -->
    <g stroke="url(#hdGoldBorder)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 202 184 L 310 184" />
      <path d="M 202 222 L 310 222" />
      <path d="M 238 184 C 286 184, 286 256, 238 256 L 202 256 L 274 328" />
    </g>

    <!-- Layer 4: Shimmering Inner Gold Core -->
    <g stroke="#FFFDE6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
      <path d="M 206 184 L 306 184" />
      <path d="M 206 222 L 306 222" />
      <path d="M 238 184 C 282 184, 282 256, 238 256 L 206 256 L 272 324" />
    </g>
  </g>

  <!-- Crown Jewel Sparkle on Top Rim of Coin -->
  <g transform="translate(256, 94)">
    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3" fill="#FEF08A" />
  </g>
</svg>
