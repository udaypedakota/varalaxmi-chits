<svg width="400" height="160" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="goldRibbon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Wave Strand 1 -->
  <path d="M-20,130 C60,90 140,160 220,110 C290,65 340,120 420,80" stroke="url(#goldRibbon1)" stroke-width="2.5" fill="none" filter="url(#goldGlow)" opacity="0.9"/>

  <!-- Wave Strand 2 -->
  <path d="M-20,145 C70,105 130,175 230,125 C310,85 360,135 430,95" stroke="url(#goldRibbon2)" stroke-width="1.8" fill="none" opacity="0.75"/>

  <!-- Wave Strand 3 -->
  <path d="M-10,120 C80,80 150,150 240,100 C300,55 350,110 420,70" stroke="url(#goldRibbon1)" stroke-width="1.2" stroke-dasharray="3 4" fill="none" opacity="0.6"/>

  <!-- Dotted Particle Swarm -->
  <circle cx="45" cy="115" r="1.5" fill="#FDE68A" opacity="0.8"/>
  <circle cx="85" cy="98" r="1.8" fill="#F59E0B" opacity="0.9"/>
  <circle cx="120" cy="135" r="1.2" fill="#FEF08A" opacity="0.7"/>
  <circle cx="160" cy="140" r="1.6" fill="#FDE68A" opacity="0.85"/>
  <circle cx="205" cy="118" r="2" fill="#F59E0B" opacity="0.95"/>
  <circle cx="250" cy="92" r="1.5" fill="#FEF08A" opacity="0.8"/>
  <circle cx="280" cy="80" r="1.2" fill="#FDE68A" opacity="0.7"/>
  <circle cx="315" cy="95" r="1.8" fill="#F59E0B" opacity="0.9"/>
  <circle cx="355" cy="110" r="1.4" fill="#FEF08A" opacity="0.8"/>
  <circle cx="385" cy="85" r="1.6" fill="#FDE68A" opacity="0.85"/>
</svg>

