  <circle cx="64" cy="64" r="39" fill="none" stroke="#FFFBEB" stroke-dasharray="2 4" stroke-width="1.5" opacity="0.8" />
  <circle cx="64" cy="64" r="34" fill="#852E03" opacity="0.6" />

  <!-- Rupee Symbol -->
  <g transform="translate(1, 1.5)" stroke="#3D1300" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
